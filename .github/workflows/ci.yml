name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PUBLIC_SUPABASE_URL: http://supaclank.test:54321
      PUBLIC_SUPABASE_ANON_KEY: sb_publishable_ACJWlzQHlZjBrEguHvfOxg_3BJgxAaH
      PUBLIC_GATEWAY_URL: http://supaclank.test:18080
      PUBLIC_PREVIEW_ROOT_DOMAIN: supaclank.test
      PUBLIC_UMAMI_TRACKED_DOMAIN: ""
      PUBLIC_UMAMI_WEBSITE_ID: ""
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run build
